# [2026-10-15] | INFO | CI.WORKFLOW | Fast feedback on every PR + push to master.
# Runs backend pytest, frontend type-check/lint/tests, and validates all
# compose variants parse correctly (portability gate).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio aiosqlite
      - name: Run backend tests
        run: python -m pytest tests/ -q --ignore=tests/integration 2>&1 | tail -20
        env:
          LLAMA_NEXUS_BACKEND_DATA_DIR: /tmp/ln-test-data
          PYTHONDONTWRITEBYTECODE: 1

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint -- --max-warnings 100 || true
      - name: Unit tests
        run: npm test -- --run --reporter=basic
        env:
          CI: true

  compose-validation:
    # [2026-10-15] | INFO | CI.COMPOSE_VALIDATION | Every compose variant must
    # parse on a clean machine (no /mnt binds, no host path assumptions).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # [2026-10-16] | FIX | CI.COMPOSE_VALIDATION | NEO4J_PASSWORD is required
      # by compose (fail-fast :? interpolation); CI validates syntax only, so a
      # dummy value suffices — same for every validate step below
      - name: Validate base compose (CPU-safe default)
        env:
          NEO4J_PASSWORD: ci-dummy
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate GPU overlay
        env:
          NEO4J_PASSWORD: ci-dummy
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: Portability check — no hardcoded host paths
        # [2026-10-15] | INFO | CI.PORTABILITY | Fails if personal host paths
        # leak back into any compose file.
        run: |
          if grep -rn "/home/alec\|/mnt/comfyui-models" docker-compose*.yml; then
            echo "::error::Personal host paths found in compose files"
            exit 1
          fi
      - name: Validate storage override example
        env:
          NEO4J_PASSWORD: ci-dummy
        run: docker compose -f docker-compose.yml -f docker-compose.storage-override.yml.example config --quiet
      - name: Validate prebuilt compose
        env:
          NEO4J_PASSWORD: ci-dummy
        run: docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml config --quiet

  smoke-e2e:
    # [2026-10-16] | INFO | CI.SMOKE_E2E | Milestone 3.2: full-pipeline validation
    # on PRs — pulls the published prebuilt stack (cpu tier), boots backend +
    # frontend, then runs scripts/smoke_e2e.sh --full: wizard flow (download
    # Qwen3-0.6B -> deploy -> chat) + STT + TTS + embed + RAG round-trips.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate .env
        run: |
          cat > .env <<'EOF'
          API_KEY=ci-smoke-key
          NEO4J_PASSWORD=ci-dummy
          LLAMACPP_DOCKER_IMAGE=ghcr.io/aleckarfonta/llama-nexus-llamacpp:cpu
          EOF
      - name: Boot stack (backend + frontend + llamacpp cpu)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml \
            up -d backend-api llamacpp-frontend llamacpp-api qdrant redis
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8700/health && break
            sleep 5
          done
          curl -sf http://localhost:8700/health
      - name: Run smoke e2e (--full)
        env:
          API_KEY: ci-smoke-key
          TOTAL_TIMEOUT: 1500
        run: bash scripts/smoke_e2e.sh --full --api-key "$API_KEY"
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml logs --tail 100
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml down -v
