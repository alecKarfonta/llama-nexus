services:
  # Qdrant Vector Database for RAG
  qdrant:
    profiles:
      - embed
    image: qdrant/qdrant:latest
    container_name: llama-nexus-qdrant
    ports:
      # Override host ports when another local GraphRAG/Qdrant stack already owns 6333/6334.
      - "${QDRANT_HTTP_PORT:-6333}:6333" # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis for event-driven architecture and caching
  redis:
    image: redis:7-alpine
    container_name: llama-nexus-redis
    ports:
      # Host 6382: avoid conflicts with other local Redis stacks on 6379/6381
      - "6382:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Management API - Controls LlamaCPP
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llamacpp-backend
    ports:
      # [2026-10-15] | INFO | compose.backend-api | Bind localhost by default;
      # set BIND_LAN=0.0.0.0 (installer LAN mode) to expose on the network.
      - "${BIND_HOST:-127.0.0.1}:8700:8700" # Management API port
    environment:
      # Default LlamaCPP configuration — generic single-GPU/CPU-safe defaults.
      # Rig-specific tuning (4-GPU Qwen3.8-Flash-Next) lives in docker-compose.rig.yml.
      - MODEL_NAME=${MODEL_NAME:-Qwen3-4B-Instruct}
      - MODEL_VARIANT=${MODEL_VARIANT:-Q4_K_M}
      - MODEL_REPO=${MODEL_REPO:-unsloth/Qwen3-4B-Instruct-2507-GGUF}
      # Host path for chat templates so backend can mount it into the managed container
      - TEMPLATES_HOST_DIR=${PWD}/chat-templates
      - CONTEXT_SIZE=${CONTEXT_SIZE:-8192}
      - GPU_LAYERS=${GPU_LAYERS:-999}
      - TEMPERATURE=1.0
      - TOP_P=0.95
      - TOP_K=20
      - MIN_P=0.0
      - REPEAT_PENALTY=1
      - REPEAT_LAST_N=64
      - FREQUENCY_PENALTY=0
      - PRESENCE_PENALTY=0
      # DRY off by default — omit from deploy command unless explicitly set in UI
      - DRY_MULTIPLIER=0.0
      - DRY_ALLOWED_LENGTH=2
      - DRY_PENALTY_LAST_N=0
      - BATCH_SIZE=1024
      - UBATCH_SIZE=512
      - THREADS=${THREADS:-0}
      - NUM_PREDICT=${NUM_PREDICT:-4096}
      - NUM_KEEP=256
      - PARALLEL_SLOTS=1
      - SPLIT_MODE=layer
      - MAIN_GPU=${MAIN_GPU:-0}
      - CACHE_TYPE_K=${CACHE_TYPE_K:-q8_0}
      - CACHE_TYPE_V=${CACHE_TYPE_V:-q8_0}
      - N_CPU_MOE=${N_CPU_MOE:-0}
      - OVERRIDE_TENSOR=${OVERRIDE_TENSOR:-}
      - TENSOR_READ_LAZY=${TENSOR_READ_LAZY:-off}
      - MMPROJ_FILE=${MMPROJ_FILE:-}
      - API_KEY=${API_KEY:-placeholder-api-key}
      - TEMPLATE_PATH=/home/llamacpp/chat-template.jinja
      # Compose project root as seen inside this container (read-only mount below)
      - PROJECT_DIR=/workspace
      - USE_DOCKER=true
      - RUNNING_IN_DOCKER=true
      - LLAMACPP_CONTAINER_NAME=llamacpp-api
      # Must match the named Docker network (see bottom of this file; override if COMPOSE_PROJECT_NAME differs)
      - DOCKER_NETWORK=${DOCKER_NETWORK:-llama-nexus_default}
      # Inference image: same tag as `llamacpp-api` service `image:` below (Deploy UI / SDK starts this image)
      - LLAMACPP_DOCKER_IMAGE=${LLAMACPP_DOCKER_IMAGE:-llama-nexus-llamacpp-api:latest}
      # Optional; if unset, derived from DOCKER_NETWORK as {project}_gpt_oss_models
      - LLAMACPP_MODELS_VOLUME=${LLAMACPP_MODELS_VOLUME:-}
      - CUDA_DEVICES=${CUDA_DEVICES:-0}
      - TENSOR_SPLIT=${TENSOR_SPLIT:-}
      # Pass through HuggingFace token from host environment
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      # Enable colored logging
      - FORCE_COLOR=1
      - TERM=xterm-256color
      # Redis for event bus and caching
      - REDIS_URL=redis://redis:6379/0
      # Qdrant for RAG vector storage
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Fine-tuning configuration
      - USE_DOCKER_TRAINING=true
      - TRAINING_IMAGE=llama-nexus-training:latest
      - HF_HOME=/root/.cache/huggingface
      - FINETUNE_DATASET_DIR=/data/finetune_datasets
      - FINETUNE_JOB_DIR=/data/finetune_jobs
      # GraphRAG integrated module.
      # Enable with: GRAPHRAG_ENABLED=true docker compose --profile graphrag up -d
      # Set GRAPHRAG_URL to an external GraphRAG API for graph/search/ingest/reasoning.
      - GRAPHRAG_ENABLED=${GRAPHRAG_ENABLED:-false}
      - GRAPHRAG_URL=${GRAPHRAG_URL:-}
      - GRAPHRAG_PIPELINE_RUNS_FILE=${GRAPHRAG_PIPELINE_RUNS_FILE:-/data/graphrag/pipeline_runs.json}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      # GraphRAG helper services. When GRAPHRAG_ENABLED=true inside Docker,
      # the backend falls back to graphrag-ner:8001, graphrag-rel:8002,
      # and graphrag-code:8000 if these are left blank.
      - NER_API_URL=${NER_API_URL:-}
      - REL_API_URL=${REL_API_URL:-}
      - CODE_RAG_URL=${CODE_RAG_URL:-}
      - REDDIT_CRAWLER_URL=${REDDIT_CRAWLER_URL:-}
      # Database paths for persistent storage
      - TOKEN_DB_PATH=/data/token_usage.db
      - CONVERSATION_DB_PATH=/data/conversations.db
      - RAG_DB_PATH=/data/rag
      # Reddit Crawler Configuration
      - REDDIT_CRAWLER_ENABLED=true
      - REDDIT_CRAWLER_INTERVAL_HOURS=6
      - REDDIT_CRAWLER_MAX_PER_RUN=50
      - REDDIT_CRAWLER_SUBREDDITS=tifu,offmychest,AmItheAsshole,confession,relationship_advice,pettyrevenge,MaliciousCompliance
      # VLM (Vision-Language Model) Configuration for PDF visual description
      - VLM_ENDPOINT_URL=${VLM_ENDPOINT_URL:-http://llamacpp-api:8080/v1}
      - VLM_API_KEY=${VLM_API_KEY:-placeholder-api-key}
      - VLM_MODEL_NAME=${VLM_MODEL_NAME:-Qwen_Qwen3-VL-4B-Thinking}
      - VLM_ENABLED=${VLM_ENABLED:-true}
      - USE_DEPLOYED_EMBEDDINGS=true
      - EMBEDDING_SERVICE_API_KEY=${EMBEDDING_SERVICE_API_KEY:-llamacpp-embed}
      - DEFAULT_EMBEDDING_MODEL=nomic-embed-text-v1.5
    volumes:
      - backend_data:/data
      - gpt_oss_models:/home/llamacpp/models
      # [2026-09-01] | INFO | compose.backend-api | HF cache on USB NVMe
      - huggingface_cache:/root/.cache/huggingface
      - ./chat-templates:/home/llamacpp/templates:ro
      # Mount llamacpp binaries
      - llamacpp_bin:/usr/local/bin:ro
      # Mount Docker socket to enable Docker operations
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount entire project directory for rebuild operations (read-only except Dockerfile)
      - .:/workspace:ro
      # Mount Dockerfile separately as read-write for version management
      - ./Dockerfile:/workspace/Dockerfile
      - ./Dockerfile.vllm:/workspace/Dockerfile.vllm
      # Conversation storage
      - conversation_data:/data/conversations
    shm_size: '16gb'
    # [2026-10-15] | INFO | compose.backend-api | GPU access (for local
    # sentence-transformers embedders) is opt-in via docker-compose.gpu.yml;
    # the base stack is CPU-safe so `docker compose up` works anywhere.
    depends_on:
      llamacpp-builder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Build container for LlamaCPP binaries
  llamacpp-builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        SKIP_BUILD_FROM_SOURCE: "false"
        # qwen4exp (Qwen3.8-Flash-Next) — merged upstream as of llama.cpp b10723 (PR #27742)
        LLAMACPP_VERSION: "b10723"
        LLAMACPP_BUILD_TAG: "b10723"
        # MTP flavor (optional): fork snapshot + draft-head patch, see Dockerfile header
        # LLAMA_CPP_REMOTE: "https://github.com/unslothai/llama.cpp.git"
        # LLAMA_CPP_REF: "bea3b12daee45876b0129a3602dc8f534ce30bf0"
        # MTP_PATCH: "patches/qwen4exp-mtp-draft-head.patch"
        ENABLE_TURBOQUANT: "false"
        CMAKE_BUILD_JOBS: ${CMAKE_BUILD_JOBS:-2}
        CUDA_ARCH: ${CUDA_ARCH:-86}
    container_name: llamacpp-builder
    volumes:
      - llamacpp_bin:/output
    command: |
      bash -c "
        cp /build/llama.cpp/build/bin/llama-server /output/
        cp /build/llama.cpp/build/bin/llama-cli /output/
        chmod +x /output/*
        echo 'LlamaCPP binaries copied'
      "

  # Llama.cpp API Server - Direct access
  llamacpp-api:
    profiles:
      - extra
    image: ${LLAMACPP_DOCKER_IMAGE:-llama-nexus-llamacpp-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_TURBOQUANT: "false"
        ENABLE_LLGUIDANCE: ${ENABLE_LLGUIDANCE:-false}
        CMAKE_BUILD_JOBS: ${CMAKE_BUILD_JOBS:-2}
        CUDA_ARCH: ${CUDA_ARCH:-86}
        # qwen4exp (Qwen3.8-Flash-Next) — merged upstream as of llama.cpp b10723 (PR #27742)
        LLAMA_CPP_REF: "b10723"
        LLAMACPP_BUILD_TAG: "b10723"
        LLAMACPP_VERSION: "b10723"
        # MTP flavor (optional): fork snapshot + draft-head patch, see Dockerfile header
        # LLAMA_CPP_REMOTE: "https://github.com/unslothai/llama.cpp.git"
        # MTP_PATCH: "patches/qwen4exp-mtp-draft-head.patch"
    container_name: llamacpp-api
    hostname: llamacpp
    ports:
      - "8600:8080" # API server port
    shm_size: '16gb'
    # [2026-10-15] | INFO | compose.llamacpp-api | NVIDIA runtime added by
    # docker-compose.gpu.yml; base stays CPU-portable.
    volumes:
      - gpt_oss_models:/home/llamacpp/models
      - ./chat-templates:/home/llamacpp/templates:ro
    environment:
      - TEMPLATE_DIR=/home/llamacpp/templates
      # __embedded_jinja__ = GGUF embedded template + --jinja only (correct multi-turn framing).
      # Empty = embedded template without --jinja (legacy). Custom files via CHAT_TEMPLATE=name.jinja.
      - CHAT_TEMPLATE=__embedded_jinja__
      # Generic single-GPU defaults; rig-specific values via docker-compose.rig.yml / .env
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-0}
      # Model configuration — generic default (rig: Qwen3.8-Flash-Next UD-IQ1_S)
      - MODEL_NAME=${MODEL_NAME:-Qwen3-4B-Instruct}
      - MODEL_VARIANT=${MODEL_VARIANT:-Q4_K_M}
      - MODEL_REPO=${MODEL_REPO:-unsloth/Qwen3-4B-Instruct-2507-GGUF}
      - CONTEXT_SIZE=${CONTEXT_SIZE:-8192}
      - DRY_MULTIPLIER=0.0
      - DRY_ALLOWED_LENGTH=2
      - DRY_PENALTY_LAST_N=0
      - FREQUENCY_PENALTY=0.0
      - PRESENCE_PENALTY=0.0
      - MIN_P=0.0
      - GPU_LAYERS=${GPU_LAYERS:-999}
      - TEMPERATURE=1.0
      - TOP_P=0.95
      - TOP_K=20
      - OVERRIDE_TENSOR=${OVERRIDE_TENSOR:-}
      - TENSOR_READ_LAZY=${TENSOR_READ_LAZY:-off}
      - MMPROJ_FILE=${MMPROJ_FILE:-}
      - API_KEY=${API_KEY:-placeholder-api-key}
      - BATCH_SIZE=1024
      - UBATCH_SIZE=512
      - THREADS=${THREADS:-0}
      - NUM_PREDICT=${NUM_PREDICT:-4096}
      - NUM_KEEP=256
      - PARALLEL_SLOTS=1
      - SPLIT_MODE=layer
      - MAIN_GPU=${MAIN_GPU:-0}
      - CACHE_TYPE_K=${CACHE_TYPE_K:-q8_0}
      - CACHE_TYPE_V=${CACHE_TYPE_V:-q8_0}
      - N_CPU_MOE=${N_CPU_MOE:-0}
      # MTP (Multi-Token Prediction) — opt-in; requires MTP-converted GGUF + image b9193+
      - MTP_ENABLED=${MTP_ENABLED:-false}
      - MTP_DRAFT_N_MAX=${MTP_DRAFT_N_MAX:-3}
      - MTP_DRAFT_N_MIN=${MTP_DRAFT_N_MIN:-0}
      - MTP_DRAFT_P_MIN=${MTP_DRAFT_P_MIN:-0.75}
      # HuggingFace token for downloads
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # [TIME] | INFO | COMPOSE.CAPTURE_TEE | streaming reverse proxy in front of
  # llama-server that tees Cursor traffic to the MTP draft-head dataset
  # (dedicated /cursor/ route; the /qwen/ public path stays capture-free)
  capture-tee:
    image: python:3.11-slim
    container_name: llamacpp-capture-tee
    hostname: capture-tee
    profiles:
      - extra
    ports:
      - "8601:8601"
    volumes:
      - datasets:/data/captures
      - ./backend/capture_tee.py:/capture_tee.py:ro
    environment:
      # [TIME] | INFO | COMPOSE.CAPTURE_TEE | llamacpp-api has no DNS alias on
      # the bridge network; use the host-published port via the gateway instead
      - TEE_UPSTREAM=http://172.18.0.1:8600
      - TEE_PORT=8601
      - TEE_CAPTURE_DIR=/data/captures
      # llama-server --api-key; client keys are swapped for this upstream
      - TEE_UPSTREAM_API_KEY=${TEE_UPSTREAM_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8601/tee/stats', timeout=3)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: [ "python3", "/capture_tee.py" ]

  # Management Frontend - React Web Interface
  llamacpp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llamacpp-frontend
    hostname: frontend
    ports:
      # [2026-10-15] | INFO | compose.llamacpp-frontend | Localhost default; BIND_HOST=0.0.0.0 for LAN.
      - "${BIND_HOST:-127.0.0.1}:3002:80" # Frontend web interface
    depends_on:
      - backend-api
      # llamacpp-api dependency removed - GPU may not always be available
    environment:
      - VITE_API_BASE_URL=
      - VITE_BACKEND_URL=
      # [2026-10-15] | INFO | compose.llamacpp-frontend | Injected into nginx.conf
      # via envsubst so the UI's llamacpp proxy auth matches the deployed API key.
      - LLAMACPP_API_KEY=${API_KEY:-placeholder-api-key}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # vLLM API Server - Qwen3.8-27B NVFP4 (hybrid Gated DeltaNet + VL; text/image/video)
  vllm-api:
    profiles:
      - vllm
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: vllm-api
    hostname: vllm
    ports:
      - "${VLLM_PUBLISHED_PORT:-8601}:${PORT:-8080}"
    shm_size: '16gb'
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ 'all' ]
              capabilities: [ gpu ]
    environment:
      # Values substituted from the host env at `docker compose` time.
      # The backend merges Deploy / VLLMManager.config here when starting or rebuilding vLLM.
      - MODEL_NAME=${MODEL_NAME:-unsloth/Qwen3.8-27B-NVFP4}
      - SERVED_MODEL_NAME=${SERVED_MODEL_NAME:-Qwen3.8-27B}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - API_KEY=${API_KEY:-placeholder-api-key}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-131072}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.95}
      - TENSOR_PARALLEL_SIZE=${TENSOR_PARALLEL_SIZE:-2}
      - PIPELINE_PARALLEL_SIZE=${PIPELINE_PARALLEL_SIZE:-1}
      - DATA_PARALLEL_SIZE=${DATA_PARALLEL_SIZE:-1}
      - KV_CACHE_DTYPE=${KV_CACHE_DTYPE:-fp8}
      - REASONING_PARSER=${REASONING_PARSER:-qwen3}
      - REASONING_PARSER_PLUGIN=${REASONING_PARSER_PLUGIN:-}
      - TOOL_CALL_PARSER=${TOOL_CALL_PARSER:-qwen3_coder}
      - VIDEO_PRUNING_RATE=${VIDEO_PRUNING_RATE:-0.5}
      - VIDEO_FPS=${VIDEO_FPS:-2}
      - VIDEO_NUM_FRAMES=${VIDEO_NUM_FRAMES:-256}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS:-16}
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS:-8192}
      - VLLM_DTYPE=${VLLM_DTYPE:-auto}
      - VLLM_QUANTIZATION=${VLLM_QUANTIZATION:-}
      - MOE_BACKEND=${MOE_BACKEND:-}
      - MAMBA_SSM_CACHE_DTYPE=${MAMBA_SSM_CACHE_DTYPE:-}
      - VLLM_ENFORCE_EAGER=${VLLM_ENFORCE_EAGER:-false}
      - VLLM_ENABLE_CHUNKED_PREFILL=${VLLM_ENABLE_CHUNKED_PREFILL:-true}
      - VLLM_ASYNC_SCHEDULING=${VLLM_ASYNC_SCHEDULING:-true}
      - TRUST_REMOTE_CODE=${TRUST_REMOTE_CODE:-true}
      - VLLM_ENABLE_AUTO_TOOL_CHOICE=${VLLM_ENABLE_AUTO_TOOL_CHOICE:-true}
      - VLLM_SPECULATIVE_CONFIG=${VLLM_SPECULATIVE_CONFIG:-}
      # [2026-08-24 | INFO | docker-compose.vllm-api | NVFP4 GEMM backend; empty = vLLM auto-select (native Blackwell W4A4)
      - VLLM_NVFP4_GEMM_BACKEND=${VLLM_NVFP4_GEMM_BACKEND:-}
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}
      - VLLM_FLASHINFER_ALLREDUCE_BACKEND=${VLLM_FLASHINFER_ALLREDUCE_BACKEND:-trtllm}
      - VLLM_USE_FLASHINFER_MOE_FP4=${VLLM_USE_FLASHINFER_MOE_FP4:-0}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=${HF_HOME:-/home/vllm/.cache/huggingface}
      - HF_HUB_CACHE=${HF_HUB_CACHE:-/home/vllm/.cache/huggingface/hub}
      # Free GPUs on this rig: 0/1 host llamacpp-embed + moss-tts; vLLM takes 2,3
      # Free pair after Qwen3.6 llama.cpp stop: 1+3 (GPU 2 hosts moss-realtime)
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-1,3}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-1,3}
    volumes:
      - vllm_models:/home/vllm/models
      - vllm_cache:/home/vllm/.cache
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

  # ========================================
  # NInfer API Server - Single-GPU Blackwell (RTX 5090) inference for
  # registered Qwen checkpoints. Built from Neroued/ninfer.
  # Start with: docker compose --profile ninfer up -d ninfer-api
  # ========================================
  ninfer-api:
    profiles:
      - ninfer
    build:
      context: ./fast-inference/ninfer
      dockerfile: Dockerfile
    image: ${NINFER_DOCKER_IMAGE:-llama-nexus-ninfer-api:latest}
    # [2026-09-28 | INFO | docker-compose.ninfer-api | Local-only tag; never pull from Hub
    # (`llama-nexus-ninfer-api` is not a public repo — pull denied then compose builds).
    pull_policy: never
    container_name: ninfer-api
    hostname: ninfer
    ports:
      - "${NINFER_PUBLISHED_PORT:-8603}:${PORT:-8080}"
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '${NINFER_GPU_DEVICE:-0}' ]
              capabilities: [ gpu ]
    volumes:
      # Shared models volume; .ninfer artifacts downloaded via Models page land here
      - gpt_oss_models:/models:ro
      - ./scripts/start-ninfer.sh:/start-ninfer.sh:ro
    environment:
      # [2026-08-24 | INFO | docker-compose.ninfer-api | Values substituted from Deploy / NinferManager at compose time
      - NINFER_MODELS_DIR=/models
      - NINFER_ARTIFACT=${NINFER_ARTIFACT:-qwen3_8_27b_nvfp4.ninfer}
      - NINFER_SERVED_MODEL_NAME=${NINFER_SERVED_MODEL_NAME:-}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - API_KEY=${API_KEY:-placeholder-api-key}
      - NINFER_MAX_CONTEXT=${NINFER_MAX_CONTEXT:-32768}
      - NINFER_KV_CAPACITY=${NINFER_KV_CAPACITY:-auto}
      # [2026-08-30 | INFO | docker-compose.ninfer-api | int8 group-64 won Phase-1 A/B
      - NINFER_KV_DTYPE=${NINFER_KV_DTYPE:-int8}
      - NINFER_MAX_CONCURRENCY=${NINFER_MAX_CONCURRENCY:-2}
      - NINFER_SPEC_ENABLED=${NINFER_SPEC_ENABLED:-true}
      - NINFER_SPEC_METHOD=${NINFER_SPEC_METHOD:-mtp}
      # [2026-08-28 | INFO | docker-compose.ninfer-api | 4 is the measured sweet
      # spot for Qwen3.8-27B MTP on Blackwell (chat +8%, code/json +10-20%; smaller
      # workloads within noise). See scripts/start-ninfer.sh for the acceptance curve.
      - NINFER_DRAFT_TOKENS=${NINFER_DRAFT_TOKENS:-4}
      - NINFER_LM_HEAD_DRAFT=${NINFER_LM_HEAD_DRAFT:-true}
      - NINFER_VISION=${NINFER_VISION:-true}
      - NINFER_TEMPERATURE=${NINFER_TEMPERATURE:-0.6}
      - NINFER_TOP_P=${NINFER_TOP_P:-0.95}
      - NINFER_TOP_K=${NINFER_TOP_K:-20}
      - NINFER_PRESENCE_PENALTY=${NINFER_PRESENCE_PENALTY:-1.0}
      - NINFER_GREEDY=${NINFER_GREEDY:-false}
      - NINFER_NO_THINKING=${NINFER_NO_THINKING:-true}
      - NINFER_GPU_DEVICE=${NINFER_GPU_DEVICE:-0}
    restart: unless-stopped
    healthcheck:
      # [2026-08-31 | INFO | docker-compose.ninfer-api | /health stays open when --api-key is set
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    entrypoint: [ "/bin/bash", "/start-ninfer.sh" ]

  # Llama.cpp Embedding Server - Optional RAG Embedding Service
  llamacpp-embed:
    profiles:
      - embed
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_ARCH: ${CUDA_ARCH:-86}
    container_name: llamacpp-embed
    hostname: llamacpp-embed
    ports:
      - "8602:8080" # Embedding server port
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # Use count: 1 to respect CUDA_VISIBLE_DEVICES for GPU pinning
              capabilities: [ gpu ]
    volumes:
      - gpt_oss_models:/home/llamacpp/models
      - ./scripts/start-embed.sh:/start-embed.sh:ro
    environment:
      # Embedding model configuration - Nomic Embed v1.5
      - MODEL_NAME=nomic-embed-text-v1.5
      - MODEL_VARIANT=Q8_0
      - MODEL_REPO=nomic-ai/nomic-embed-text-v1.5-GGUF
      - MODEL_FILE=nomic-embed-text-v1.5.Q8_0.gguf
      - CONTEXT_SIZE=8192
      - GPU_LAYERS=999
      - HOST=0.0.0.0
      - PORT=8080
      - API_KEY=${EMBEDDING_SERVICE_API_KEY:-llamacpp-embed}
      - THREADS=8
      - BATCH_SIZE=1024
      - UBATCH_SIZE=1024
      - POOLING_TYPE=mean
      - PARALLEL=8
      # HuggingFace token for downloads
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      # GPU device pinning - NVIDIA_VISIBLE_DEVICES is respected by Docker runtime
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - NVIDIA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    entrypoint: [ "/bin/bash", "/start-embed.sh" ]

  training:
    profiles:
      - training  
    build:
      context: ./backend
      dockerfile: Dockerfile.training
    container_name: llama-nexus-training
    # GPU reservations for QLoRA training (requires sm_70+ GPU)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ 'all' ]
              capabilities: [ gpu ]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - REDIS_URL=redis://redis:6379/0
      - FINETUNE_DATASET_DIR=/data/finetune_datasets
      - FINETUNE_JOB_DIR=/data/finetune_jobs
      - HF_HOME=/root/.cache/huggingface
      # Set to false to enable GPU training with QLoRA (requires compatible GPU)
      - FORCE_CPU_TRAINING=false
    volumes:
      # Share the backend data volume for job configs and datasets
      - backend_data:/data
      # HuggingFace model cache
      - huggingface_cache:/root/.cache/huggingface
      # Models directory for saving merged models
      - gpt_oss_models:/home/llamacpp/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Quantization Worker - Model Quantization Service
  quantization-worker:
    profiles:
      - quantize
    build:
      context: ./backend
      dockerfile: Dockerfile.quantization
    container_name: quantization-worker
    hostname: quantization-worker
    shm_size: '16gb'
    runtime: nvidia
    volumes:
      - gpt_oss_models:/home/llamacpp/models
      - backend_data:/data
      - quantization_output:/app/quantization_output
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODELS_DIR=/home/llamacpp/models
      - QUANTIZATION_OUTPUT_DIR=/app/quantization_output
      - QUANTIZATION_DB_PATH=/data/quantization.db
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import redis; redis.from_url('redis://redis:6379/0').ping()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # LM-Eval Worker - API-backed model evaluation (no local GPU needed)
  lm-eval-worker:
    profiles:
      - eval
    build:
      context: ./backend
      dockerfile: Dockerfile.lm-eval
    container_name: lm-eval-worker
    hostname: lm-eval-worker
    volumes:
      - backend_data:/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LM_EVAL_OUTPUT_DIR=/data/lm_eval_results
      # Route lm-eval through the app backend so it benchmarks the user's active deployment.
      - LLAMACPP_API_URL=http://backend-api:8700
      - LM_EVAL_DEPLOYED_API_URL=http://backend-api:8700
      - LM_EVAL_API_KEY=placeholder-api-key
      - LM_EVAL_NUM_CONCURRENT=1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import redis; redis.from_url('redis://redis:6379/0').ping()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Terminal-Bench Worker - Harbor-based agentic benchmark runner
  terminal-bench-worker:
    profiles:
      - eval
    build:
      context: ./backend
      dockerfile: Dockerfile.terminal-bench
    container_name: terminal-bench-worker
    hostname: terminal-bench-worker
    shm_size: '16gb'
    command: [ "python3", "/app/lm_eval_worker.py" ]
    volumes:
      - backend_data:/data
      - huggingface_cache:/root/.cache/huggingface
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
    environment:
      - WORKER_MODE=terminal_bench
      - REDIS_URL=redis://redis:6379/0
      - TERMINAL_BENCH_OUTPUT_DIR=/data/terminal_bench_results
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - LLAMACPP_API_URL=http://backend-api:8700
      - OPENAI_API_KEY=placeholder-api-key
      - OPENAI_BASE_URL=http://backend-api:8700/v1
    depends_on:
      redis:
        condition: service_healthy
      backend-api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import redis; redis.from_url('redis://redis:6379/0').ping()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Training image builder (run with: docker compose build training-image)
  training-image:
    build:
      context: ./backend
      dockerfile: Dockerfile.training
    image: llama-nexus-training:latest
    profiles:
      - build-only # Only build, don't run as a service
    command: [ "echo", "Training image built successfully" ]

  # =============================================================
  # STREAMING STT: NVIDIA Nemotron Speech Streaming
  # Real-time speech-to-text with cache-aware streaming inference
  # Start with: docker compose --profile streaming-stt up -d streaming-stt
  # =============================================================
  streaming-stt:
    profiles:
      - streaming-stt 
    build:
      context: ./streaming-stt
      dockerfile: Dockerfile
    container_name: streaming-stt
    ports:
      - "8609:8009"
    # NVIDIA NeMo Framework requires these settings for proper SHMEM allocation
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      # The NeMo model to use for streaming STT
      - MODEL_NAME=${STREAMING_STT_MODEL:-nvidia/nemotron-speech-streaming-en-0.6b}
      # Audio chunk size sent from frontend (ms). Keep at 80ms for optimal latency
      - CHUNK_SIZE_MS=${STREAMING_STT_CHUNK_MS:-80}
      # Audio sample rate (Hz). Model expects 16kHz
      - SAMPLE_RATE=${STREAMING_STT_SAMPLE_RATE:-16000}
      # RMS level to detect speech start. Lower = more sensitive to quiet speech
      - VAD_THRESHOLD=${STT_VAD_THRESHOLD:-0.005}
      # RMS level to detect silence. Lower = more tolerant of quiet pauses
      - VAD_SILENCE_THRESHOLD=${STT_VAD_SILENCE_THRESHOLD:-0.005}
      # Debounce time for speech/silence transitions
      - VAD_HYSTERESIS_MS=${STT_VAD_HYSTERESIS_MS:-100}
      # Silence duration (ms) before pending text is committed as a sentence
      - SENTENCE_END_SILENCE_MS=${STT_SENTENCE_END_SILENCE_MS:-800}
      # Minimum word count for text to be committed as a sentence
      - MIN_SENTENCE_WORDS=${STT_MIN_SENTENCE_WORDS:-2}
      # Audio buffer before model inference (~900ms optimal for NeMo)
      - MODEL_BUFFER_MS=${STT_MODEL_BUFFER_MS:-896}
      # Logging level (DEBUG, INFO, WARNING, ERROR)
      - LOG_LEVEL=${STT_LOG_LEVEL:-INFO}
      - NVIDIA_VISIBLE_DEVICES=all
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8009/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s # NeMo model loading takes time
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

  # ========================================
  # GraphRAG: Neo4j Knowledge Graph (optional)
  # Start with: docker compose --profile graphrag up -d
  # ========================================
  neo4j:
    profiles:
      - graphrag  
    image: neo4j:5.11
    container_name: llama-nexus-neo4j
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ========================================
  # GraphRAG NER Service (GLiNER entity extraction)
  # Opt-in: Start with docker compose --profile graphrag-ner up -d
  # ========================================
  graphrag-ner:
    profiles:
      - graphrag
      - graphrag-ner
    build:
      context: ./services/ner_api
      dockerfile: Dockerfile
    container_name: llama-nexus-ner
    ports:
      - "8711:8001"
    environment:
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface/transformers
      - CUDA_VISIBLE_DEVICES=  # Force CPU-only mode
    volumes:
      - ner_cache:/app/.cache
      - ner_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # ========================================
  # GraphRAG Relationship Extraction Service
  # Opt-in: Start with docker compose --profile graphrag-rel up -d
  # ========================================
  graphrag-rel:
    profiles:
      - graphrag
      - graphrag-rel
    build:
      context: ./services/rel_api
      dockerfile: Dockerfile
    container_name: llama-nexus-rel
    ports:
      - "8712:8002"
    environment:
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface/transformers
      - CUDA_VISIBLE_DEVICES=  # Force CPU-only mode
    volumes:
      - rel_cache:/app/.cache
      - rel_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # ========================================
  # GraphRAG Code-RAG Service (code detection/search)
  # Opt-in: Start with docker compose --profile graphrag-code up -d
  # ========================================
  graphrag-code:
    profiles:
      - graphrag
      - graphrag-code
    build:
      context: ./services/code_rag
      dockerfile: Dockerfile
    container_name: llama-nexus-code-rag
    ports:
      - "8713:8000"
    environment:
      - HF_HOME=/app/.cache/huggingface
      - GRAPHRAG_API_URL=http://backend-api:8700
    volumes:
      - code_rag_cache:/app/.cache
      - code_rag_models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  # [2026-10-15] | INFO | compose.volumes | Portable named volumes by default.
  # To store weights on a specific host path (e.g. large NVMe), copy
  # docker-compose.storage-override.yml.example -> docker-compose.storage-override.yml,
  # set bind paths there, and run:
  #   docker compose -f docker-compose.yml -f docker-compose.storage-override.yml up -d
  gpt_oss_models:
    driver: local
  datasets:
    driver: local
  llamacpp_bin:
    driver: local
  finetune_data:
    driver: local
  vllm_models:
    driver: local
  vllm_cache:
    driver: local
  conversation_data:
    driver: local
  redis_data:
    driver: local
  backend_data:
    driver: local
  qdrant_data:
    driver: local
  quantization_output:
    driver: local
  huggingface_cache:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  # GraphRAG service volumes
  ner_cache:
    driver: local
  ner_models:
    driver: local
  rel_cache:
    driver: local
  rel_models:
    driver: local
  code_rag_cache:
    driver: local
  code_rag_models:
    driver: local

# Explicitly name the default network so external stacks (e.g. graphrag)
# can reference it to access shared services like llamacpp-embed
networks:
  default:
    name: llama-nexus_default
